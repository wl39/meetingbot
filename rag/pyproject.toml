[project]
name = "meetingbot-rag"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "meetingbot-access",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "qdrant-client>=1.14,<2",
  "sentence-transformers>=5,<6",
  "openpyxl>=3.1,<4",
  "langchain-openai>=1,<2",
  "httpx>=0.28,<1",
  "markdown-it-py[linkify]==4.0.0",
  "mdit-py-plugins==0.5.0",
  "bleach==6.2.0",
]
[tool.uv.sources]
meetingbot-access = { path = "../shared/access", editable = true }
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
