[project]
name = "meetingbot-stt"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = ["meetingbot-access", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "python-multipart>=0.0.18", "numpy>=2,<3", "soxr>=0.5,<1"]

[tool.uv.sources]
meetingbot-access = { path = "../shared/access", editable = true }

[project.optional-dependencies]
speech = [
    "mlx-whisper>=0.4,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyannote.audio>=4,<5",
    "silero-vad>=6,<7",
    "huggingface-hub>=0.34,<2",
    "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
